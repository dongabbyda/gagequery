<header class="topbar">
  <button id="menu-btn" class="top-btn" type="button" aria-label="Open the module list">Modules</button>
  <a class="brand" href="#home">{{LOGO}}<b>GageQuery</b></a>
  <label class="ds-pick"><span>Dataset</span><select id="ds-select" aria-label="Dataset"></select></label>
  <span class="sp"></span>
  <div class="meter"><i><u id="meter-bar"></u></i><span id="meter-text"></span></div>
  <span id="engine" class="engine">Loading engine</span>
  <button id="pal-btn" class="top-btn" type="button" aria-label="Find anything (Ctrl or Command + K)">Find ⌘K</button>
</header>
<div class="shell">
  <nav id="rail" class="rail" aria-label="Modules"></nav>
  <main id="main"><div class="page"><p class="muted">Loading GageQuery…</p></div></main>
</div>
<div id="scrim" class="scrim"></div>
<div id="palette" class="palette" hidden><div class="pal-box" role="dialog" aria-label="Find anything"><input id="pal-input" type="text" placeholder="Jump to a module, exercise, page or dataset" autocomplete="off"><ul id="pal-list" role="listbox"></ul></div></div>
<div id="toasts"></div>
